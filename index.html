<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0f1a" />
  <title>💬 Chat Global</title>
  <meta name="description" content="Chat global em tempo real — 100% estático, hospedado no GitHub Pages com Firebase." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== TELA DE ENTRADA (nome de usuário) ===== -->
  <div id="login-overlay">
    <form id="login-form" class="login-card">
      <div class="login-logo">💬</div>
      <h1>Chat Global</h1>
      <p>Converse com todo mundo, em tempo real.</p>
      <input id="name-input" type="text" placeholder="Escolha seu nome..." maxlength="20" autocomplete="off" required />
      <button type="submit">Entrar no chat ➜</button>
    </form>
  </div>

  <!-- ===== CHAT ===== -->
  <main id="chat" class="hidden">
    <header>
      <div class="brand">💬 Chat Global</div>
      <div class="header-right">
        <button id="friends-btn" type="button" title="Amigos">👥<span id="friends-badge" class="friends-badge hidden"></span></button>
        <button id="call-btn" type="button" title="Chamada de voz em grupo">📞</button>
        <button id="stream-btn" type="button" title="Transmitir sua tela">🖥️</button>
        <button id="music-btn" type="button" title="Tocar música">🎵</button>
        <div id="online-count" class="online-pill" title="Usuários conectados agora">🟢 conectando...</div>
      </div>
    </header>

    <!-- Banner de transmissão ao vivo -->
    <div id="live-banner" class="live-banner hidden">
      <button id="watch-btn" type="button">🔴 Transmissão ao vivo</button>
    </div>

    <div id="messages"></div>

    <form id="message-form">
      <input id="message-input" type="text" placeholder="Digite sua mensagem..." maxlength="500" autocomplete="off" required />
      <button type="submit" title="Enviar">➤</button>
    </form>
  </main>

  <!-- 🖥️ Player da transmissão ao vivo -->
  <div id="watch-overlay" class="watch-overlay hidden">
    <video id="watch-video" autoplay playsinline></video>
    <button id="watch-close" type="button">✕ Sair da transmissão</button>
  </div>

  <!-- 📞 Painel de chamada: escolher quem chamar -->
  <div id="call-panel" class="call-panel hidden">
    <div class="call-box">
      <div class="call-box-head">
        <h3>📞 Chamada de voz em grupo</h3>
        <button id="call-panel-close" type="button" class="icon-btn">✕</button>
      </div>
      <p id="call-online-hint">Selecione quem você quer chamar:</p>
      <div id="call-user-list" class="call-user-list"></div>
      <button id="start-call-btn" type="button" class="btn-primary">Iniciar chamada ➜</button>
    </div>
  </div>

  <!-- 🔔 Toque de chamada recebida -->
  <div id="ring-overlay" class="ring-overlay hidden">
    <div class="ring-box">
      <div class="ring-icon">📞</div>
      <h3 id="ring-title">Estão te chamando!</h3>
      <p id="ring-sub">Chamada de voz em grupo</p>
      <div class="ring-actions">
        <button id="ring-accept" type="button" class="btn-accept">✅ Atender</button>
        <button id="ring-decline" type="button" class="btn-decline">✖ Recusar</button>
      </div>
    </div>
  </div>

  <!-- 🔊 Painel da chamada em andamento -->
  <div id="call-overlay" class="call-overlay hidden">
    <div class="call-head">
      <span id="call-room-label">🔊 Chamada</span>
      <button id="call-leave" type="button" class="btn-leave">🚪 Sair</button>
    </div>
    <div id="call-members" class="call-members"></div>
    <div class="call-controls">
      <button id="call-mute" type="button" class="ctl-btn" title="Microfone">🎙️</button>
      <button id="call-invite-more" type="button" class="ctl-btn" title="Convidar mais">➕</button>
    </div>
    <div id="call-audio-container" class="hidden"></div>
  </div>

  <!-- 👥 Painel de amigos -->
  <div id="friends-panel" class="friends-panel hidden">
    <div class="friends-head">
      <h3>👥 Amigos</h3>
      <button id="friends-close" type="button" class="icon-btn">✕</button>
    </div>

    <div class="friends-section">
      <h4>Adicionar amigos</h4>
      <div id="add-friend-list"></div>
    </div>

    <div class="friends-section">
      <h4 id="requests-title">Solicitações</h4>
      <div id="requests-list"></div>
    </div>

    <div class="friends-section">
      <h4 id="friends-title">Meus amigos</h4>
      <div id="friends-list"></div>
    </div>
  </div>

  <!-- 💬 Conversa privada (DM) -->
  <div id="dm-overlay" class="dm-overlay hidden">
    <div class="dm-head">
      <button id="dm-back" type="button" class="icon-btn" title="Voltar">←</button>
      <span id="dm-friend-name">Amigo</span>
      <span id="dm-friend-status"></span>
      <button id="dm-remove" type="button" class="icon-btn" title="Remover amizade">🗑️</button>
      <button id="dm-close" type="button" class="icon-btn" title="Fechar">✕</button>
    </div>
    <div id="dm-messages" class="dm-messages"></div>
    <form id="dm-form" class="dm-form">
      <input id="dm-input" type="text" placeholder="Mensagem privada..." maxlength="500" autocomplete="off" required />
      <button type="submit">➤</button>
    </form>
  </div>

  <!-- 🎵 Música de fundo (clique no botão do topo para tocar) -->
  <audio id="bg-music" src="musica.mp3" loop preload="none"></audio>

  <script type="module" src="app.js"></script>
</body>
</html>
