[package]
name = "limon"
version = "1.0.0"
description = "Limon — chat global em tempo real"
edition = "2021"

[lib]
name = "limon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
